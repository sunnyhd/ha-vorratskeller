# Home-Assistant-Paket "Vorratskeller" (Grocy -> Einkaufsliste, Hinweise, Tablet-Knöpfe)
#
# Ablage: /config/packages/vorrat.yaml
# In configuration.yaml einmalig:
#   homeassistant:
#     packages: !include_dir_named packages
# In secrets.yaml (Schlüssel zusätzlich in Bitwarden ablegen):
#   grocy_api_key: "<API-Schlüssel aus Grocy>"
# Adresse: Home Assistant erreicht das Grocy-Add-on intern unter http://a0d7b954-grocy (Port 80 im
# Add-on-Netz, mit API-Schlüssel). Kein Port nach außen nötig. Klappt das nicht, im Add-on unter
# Netzwerk Port 80 auf z. B. 9192 legen und hier http://homeassistant.local:9192 eintragen.
#
# Grocy-API laut v4.7.1: GET /api/stock/volatile?due_soon_days=N liefert
# due_products, overdue_products, expired_products, missing_products;
# POST /api/stock/products/{id}/consume mit {"amount": n}.

rest:
  - resource: "http://a0d7b954-grocy/api/stock/volatile?due_soon_days=30"
    headers:
      GROCY-API-KEY: !secret grocy_api_key
    scan_interval: 900
    sensor:
      - name: "Vorrat Status"
        unique_id: vorrat_status
        icon: mdi:warehouse
        unit_of_measurement: "fehlen"
        value_template: "{{ value_json.missing_products | count }}"
        json_attributes:
          - missing_products
          - due_products
          - overdue_products
          - expired_products

rest_command:
  grocy_entnehmen:
    url: "http://a0d7b954-grocy/api/stock/products/{{ product_id }}/consume"
    method: post
    headers:
      GROCY-API-KEY: !secret grocy_api_key
    content_type: "application/json"
    payload: '{"amount": {{ amount | default(1) }}, "spoiled": false}'

automation:
  - id: vorrat_fehlendes_auf_einkaufsliste
    alias: "Vorrat: Fehlendes auf die Einkaufsliste"
    description: "Was unter das 14-Tage-Soll fällt, kommt einmal auf die Einkaufsliste."
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.vorrat_status
        attribute: missing_products
    actions:
      - action: todo.get_items
        target:
          entity_id: todo.shopping_list
        data:
          status: needs_action
        response_variable: liste
      - variables:
          offen: "{{ liste['todo.shopping_list']['items'] | map(attribute='summary') | list }}"
      - repeat:
          for_each: "{{ state_attr('sensor.vorrat_status', 'missing_products') or [] }}"
          sequence:
            - variables:
                eintrag: "{{ repeat.item.name }} (Vorrat)"
            - if:
                - condition: template
                  value_template: "{{ eintrag not in offen }}"
              then:
                - action: todo.add_item
                  target:
                    entity_id: todo.shopping_list
                  data:
                    item: "{{ eintrag }}"
                    description: "Fehlen {{ repeat.item.amount_missing | float(0) | round(0) | int }} bis zum 14-Tage-Soll"

  - id: vorrat_wochenhinweis
    alias: "Vorrat: Diese Woche verbrauchen"
    description: "Samstag 10 Uhr: was in 30 Tagen abläuft, als Anstoß für das Vorratsgericht."
    triggers:
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: time
        weekday: [sat]
      - condition: template
        value_template: "{{ (state_attr('sensor.vorrat_status', 'due_products') or []) | count > 0 }}"
    actions:
      # notify.notify geht an das erste Handy; für die Familie eine Benachrichtigungsgruppe anlegen.
      - action: notify.notify
        data:
          title: "Vorratskeller: bitte bald verbrauchen"
          message: >-
            {% for p in state_attr('sensor.vorrat_status', 'due_products') -%}
            {{ p.product.name }} (bis {{ p.best_before_date }}){{ ', ' if not loop.last }}
            {%- endfor %}
