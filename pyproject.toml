[project]
name = "ha-vorratskeller"
version = "0.1.0"
description = "Lagerverwaltung für den Vorratskeller als Home-Assistant-Integration"
requires-python = ">=3.14"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375", "home-assistant-frontend==20260930.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
