name: Prüfen

on:
  # Nur main und PRs prüfen: sonst läuft jeder Push auf einen PR-Branch doppelt, Tags ein drittes Mal
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push bricht den laufenden Lauf desselben Branches ab
concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python pytest-homeassistant-custom-component==0.13.375 home-assistant-frontend==20260930.5 ruff
      - name: Ruff
        run: |
          .venv/bin/ruff check custom_components tests
          .venv/bin/ruff format --check custom_components tests
      - name: Pytest
        run: .venv/bin/python -m pytest tests -q
      - name: Frontend-Tests
        run: node --test tests/frontend/*.test.mjs
